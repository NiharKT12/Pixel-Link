<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelLink - Analytics</title>
    <meta name="description" content="Look up click analytics for a Pixel Link short code.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%231a1a2e'/><rect x='3' y='6' width='4' height='4' fill='%23ff6b9d'/><rect x='9' y='6' width='4' height='4' fill='%2354d7ff'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <!-- Pixel decorations -->
    <div class="pixel-corner top-left" aria-hidden="true"></div>
    <div class="pixel-corner top-right" aria-hidden="true"></div>
    <div class="pixel-corner bottom-left" aria-hidden="true"></div>
    <div class="pixel-corner bottom-right" aria-hidden="true"></div>

    <div class="pixel-dots" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <nav class="session-nav" id="sessionNav" aria-label="Account" data-back="index.html"></nav>

    <h1 class="title">Analytics</h1>

    <a href="index.html" class="back-link">← Back</a>

    <main class="container">
        <label class="visually-hidden" for="codeInput">Short code or full short URL</label>
        <input type="text" id="codeInput" placeholder="Enter short code" autocomplete="off" spellcheck="false" />
        <button id="checkBtn">Check</button>
        <div id="errorMsg" class="error-message" role="status" aria-live="polite"></div>
    </main>

    <!-- Stats Result -->
    <div id="statsResult" class="stats-result hidden">
        <table class="stats-table">
            <caption class="visually-hidden">Statistics for the requested short code</caption>
            <tr>
                <th scope="col">Short Code</th>
                <th scope="col">Clicks</th>
                <th scope="col">Created</th>
            </tr>
            <tr>
                <td id="resultCode">-</td>
                <td id="resultClicks" class="clicks">0</td>
                <td id="resultDate">-</td>
            </tr>
        </table>
        <div class="url-row">
            <span class="url-label">Original URL:</span>
            <span id="resultUrl" class="url-value">-</span>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        warmBackend();
        renderSessionNav(document.getElementById('sessionNav'));

        const codeInput = document.getElementById('codeInput');
        const checkBtn = document.getElementById('checkBtn');
        const statsResult = document.getElementById('statsResult');
        const resultCode = document.getElementById('resultCode');
        const resultUrl = document.getElementById('resultUrl');
        const resultClicks = document.getElementById('resultClicks');
        const resultDate = document.getElementById('resultDate');
        const showError = createErrorReporter(document.getElementById('errorMsg'));

        function formatDate(dateString) {
            const date = new Date(dateString);
            if (Number.isNaN(date.getTime())) return '-';

            return date.toLocaleDateString(undefined, {
                month: 'short',
                day: 'numeric',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        checkBtn.addEventListener('click', async () => {
            let code = codeInput.value.trim();

            if (!code) {
                showError('Please enter a short code');
                return;
            }

            // Accept a pasted full URL as well as a bare code
            if (code.includes('/')) {
                code = code.split('/').filter(Boolean).pop() || '';
            }

            if (!/^[0-9a-zA-Z_-]{1,30}$/.test(code)) {
                showError('That does not look like a short code');
                return;
            }

            try {
                const data = await withBusyButton(checkBtn, 'Loading...', () =>
                    requestJson(`/api/stats/${encodeURIComponent(code)}`)
                );

                resultCode.textContent = data.shortCode;
                resultUrl.textContent = data.originalUrl;
                resultUrl.title = data.originalUrl;
                resultClicks.textContent = data.clicks;
                resultDate.textContent = formatDate(data.createdAt);

                statsResult.classList.remove('hidden');
            } catch (error) {
                showError(error.message);
                statsResult.classList.add('hidden');
            }
        });

        submitOnEnter(codeInput, checkBtn);
    </script>
</body>
</html>
